name: expo-check (fork only)
on:
  push:
    branches: [ci/expo-check]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce6de2a539fd34d4d6ce5c498fdeebd03941ed56
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git log -1 --format='tested head %H'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run typecheck:workspaces
      - run: npm run lint
      - run: npm test
